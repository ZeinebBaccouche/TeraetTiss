<section class="py-12 px-4 max-w-7xl mx-auto bg-stone-50 min-h-screen">
    <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">
            L'Artisanat <span class="text-emerald-700">Tunisien</span>
        </h1>

        <p class="text-lg text-gray-500 max-w-2xl mx-auto">
            Découvrez des pièces uniques, faites main par les artisans de nos régions. Soutenez le savoir-faire local.
        </p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-center justify-center">
        <div class="w-full md:w-1/3">
            <label class="block text-sm font-bold text-gray-700 mb-1">Rechercher par nom</label>
            <input type="text" [(ngModel)]="rechercheNom" placeholder="Ex: Vase, Tapis..."
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div class="w-full md:w-1/3">
            <label class="block text-sm font-bold text-gray-700 mb-1">Prix maximum (DT)</label>
            <input type="number" [(ngModel)]="recherchePrix" placeholder="Ex: 50"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8">
        @for (p of produitsAffiches(); track p.id) {
        <app-produit-item [produit]="p" class="h-full"></app-produit-item>
        } @empty {
        <p class="text-gray-500 col-span-full text-center text-lg py-10">
            Aucun produit ne correspond à votre recherche.
        </p>
        }
    </div>

</section>
