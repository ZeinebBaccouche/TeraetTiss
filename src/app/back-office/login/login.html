<div class="min-h-screen flex items-center justify-center py-10 px-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    
    <h2 class="text-2xl font-extrabold text-gray-900 text-center mb-6">Connexion Admin</h2>

    <form class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Nom d'utilisateur</label>
        <input type="text" placeholder="admin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Mot de passe</label>
        <input type="password" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition-colors">
        Se connecter
      </button>
    </form>

  </div>
</div>
